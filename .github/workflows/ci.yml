name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.25 is the version go.mod requires; 1.27 is the current release.
        # Loading packages depends on the toolchain's export data format, and a
        # newer toolchain has broken it before, so both are exercised.
        go-version: ["1.25", "1.27"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./cmd/godoclive

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Run vet
        run: go vet ./...

      - name: "Generate coverage"
        run: go test -coverprofile=coverage.txt ./...

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: dicki/godoclive

  # The published action is plumbing — six shell steps and a composite wrapper
  # that no unit test reaches. Running it against a fixture service on every PR
  # is what catches a broken input reference or a shell quoting slip before a
  # user's pipeline does.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build the action's binary from this checkout
        run: |
          go build -o "$(go env GOPATH)/bin/godoclive" ./cmd/godoclive
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run the action against a fixture service
        id: docs
        uses: ./
        with:
          working-directory: testdata/gin-realworld
          version: skip-install
          openapi: openapi.json
          docs: site
          min-coverage: "50"

      - name: Check the action produced what it reported
        run: |
          set -euo pipefail
          test -f testdata/gin-realworld/openapi.json
          test -f testdata/gin-realworld/site/index.html
          echo "endpoints=${{ steps.docs.outputs.endpoints }} coverage=${{ steps.docs.outputs.coverage }}%"
          test "${{ steps.docs.outputs.endpoints }}" -gt 0

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.10.1
